services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metnum-backend
    ports:
      - "8083:8083"
    restart: unless-stopped

  frontend:
    build:
      context: ../desafio_final_frontend
      dockerfile: Dockerfile
    container_name: metnum-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

spring.application.name=desafio_final
server.port=8080

# ============================================================
# IMPORTANTE: Spring Boot 4.x cambio los paquetes de autoconfiguracion
# Los paquetes ya NO son org.springframework.boot.autoconfigure.*
# Ahora son separados por modulo (jdbc, hibernate, etc.)
# Excluimos JPA/DataSource porque estos escenarios son puramente computacionales
# (si en el futuro agregas BD, quita estas 3 lineas y configura el datasource)
# ============================================================
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

